# A ogni push su main: ricostruisce il sito, passa il controllo qualita' e
# pubblica su GitHub Pages. Sulle pull request si ferma alla verifica.
#
# Sito pubblicato: https://fico-azienda.github.io/studio-dentistico/
name: Build e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verifica:
    name: Build e controllo qualita'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Genera il sito
        run: node build.mjs
      - name: Test del flusso di prenotazione
        run: node --test "tests/*.test.mjs"
      - name: Controlla link, alt, title e dati strutturati
        run: node scripts/check.mjs
      - name: Fallisci se il controllo segnala problemi
        run: node scripts/check.mjs | grep -q "Nessun problema rilevato"

  deploy:
    name: Pubblica su GitHub Pages
    needs: verifica
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
